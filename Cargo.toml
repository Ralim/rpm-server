[package]
name = "rpm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8.9"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
hex = "0.4.3"
html-escape = "0.3.0"
percent-encoding = "2.3.2"
# Must match the pgp version used by the rpm crate (it is not re-exported).
pgp = "=0.20.0"
quick-xml = "0.42.0"
# pgp 0.20 uses rand 0.8's RNG traits.
rand = "0.8"
rpm = { version = "0.30.2", default-features = false, features = ["signature-pgp"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
# Tests build RPMs in memory, which needs the payload builder.
rpm = { version = "0.30.2", default-features = false, features = ["signature-pgp", "payload", "gzip-compression"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
